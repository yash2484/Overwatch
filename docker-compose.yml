services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: overwatch
      POSTGRES_PASSWORD: overwatch_dev
      POSTGRES_DB: overwatch
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overwatch -d overwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Settings(env_file=".env") resolves .env relative to the CWD *inside* the container
  # (/app), and the repo-root .env is not mounted there — so secrets must be passed in as
  # real environment variables. Compose interpolates ${...} from the gitignored ./.env at
  # the repo root, which keeps the key out of this file and out of git. Unset -> empty ->
  # Settings.anthropic_api_key is falsy -> POST /briefs answers 422 briefs_unconfigured,
  # which is the intended behavior for a server with no key, not a crash.
  api:
    build: ./backend
    # --reload: src/ is bind-mounted, so API code changes apply without a restart.
    # (Celery worker/beat have no equivalent — restart them after touching workers/.)
    command: uvicorn overwatch.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    environment:
      OVERWATCH_DATABASE_URL: postgresql://overwatch:overwatch_dev@postgis:5432/overwatch
      OVERWATCH_REDIS_URL: redis://redis:6379/0
      OVERWATCH_ANTHROPIC_API_KEY: "${OVERWATCH_ANTHROPIC_API_KEY:-}"
      OVERWATCH_FUSION_ENABLED: "${OVERWATCH_FUSION_ENABLED:-true}"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./data:/app/data
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The worker is where the real Anthropic call actually happens (AnthropicBriefGenerator),
  # so it needs the key as much as the API does. Both flags are set identically on all three
  # backend services on purpose: a split config — fusion on in the API, off in beat — is a
  # confusing bug waiting to happen, and worth more than the marginal least-privilege win.
  worker:
    build: ./backend
    command: celery -A overwatch.workers.celery_app worker --loglevel=info
    environment:
      OVERWATCH_DATABASE_URL: postgresql://overwatch:overwatch_dev@postgis:5432/overwatch
      OVERWATCH_REDIS_URL: redis://redis:6379/0
      OVERWATCH_ANTHROPIC_API_KEY: "${OVERWATCH_ANTHROPIC_API_KEY:-}"
      OVERWATCH_FUSION_ENABLED: "${OVERWATCH_FUSION_ENABLED:-true}"
    volumes:
      - ./backend/src:/app/src
      - ./data:/app/data
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A overwatch.workers.celery_app beat --loglevel=info
    environment:
      OVERWATCH_DATABASE_URL: postgresql://overwatch:overwatch_dev@postgis:5432/overwatch
      OVERWATCH_REDIS_URL: redis://redis:6379/0
      OVERWATCH_ANTHROPIC_API_KEY: "${OVERWATCH_ANTHROPIC_API_KEY:-}"
      OVERWATCH_FUSION_ENABLED: "${OVERWATCH_FUSION_ENABLED:-true}"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgis_data:
