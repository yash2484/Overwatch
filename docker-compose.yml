services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: overwatch
      POSTGRES_PASSWORD: overwatch_dev
      POSTGRES_DB: overwatch
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overwatch -d overwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      OVERWATCH_DATABASE_URL: postgresql://overwatch:overwatch_dev@postgis:5432/overwatch
      OVERWATCH_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./data:/app/data
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A overwatch.workers.celery_app worker --loglevel=info
    environment:
      OVERWATCH_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A overwatch.workers.celery_app beat --loglevel=info
    environment:
      OVERWATCH_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgis_data:
