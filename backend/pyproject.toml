[project]
name = "overwatch"
version = "0.1.0"
description = "Geospatial change-detection intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "celery[redis]>=5.4",
    "rasterio>=1.4",
    "numpy>=2.0",
    "affine>=2.4",
    "shapely>=2.0",
    "pyproj>=3.7",
    "pystac-client>=0.8",
    "pillow>=11.0",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.16",
    "psycopg[binary]>=3.2",
    "anthropic>=0.116",
    "alembic>=1.14",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "httpx>=0.27",  # GDELT DOC 2.0 client (Phase 5) — runtime, not just tests
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overwatch"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
